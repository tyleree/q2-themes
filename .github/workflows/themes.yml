name: Themes

on:
  pull_request:
    paths: ['themes/**', 'tools/**']
  push:
    branches: [main]
    paths: ['themes/**', 'tools/**']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_index.py
      - name: Publish the index
        if: github.event_name == 'push'
        run: |
          git config user.name 'q2-themes'
          git config user.email 'q2-themes@users.noreply.github.com'
          git add index.json
          git diff --cached --quiet || { git commit -m 'index: rebuild' && git push; }
